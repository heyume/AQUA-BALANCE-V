<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AquaBalance - Classroom Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #7fd8f0; color: #012a3d; }
  #app { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  #canvasWrap { position: absolute; inset: 0; z-index: 0; }
  canvas { display: block; width: 100% !important; height: 100% !important; }
  #topHUD { position: relative; z-index: 10; padding: 5px 8px 4px; background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.45) 70%, transparent 100%); display: flex; flex-direction: column; gap: 4px; }
  .hudRow { display: flex; gap: 5px; align-items: center; justify-content: space-between; }
  .title { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #0077aa; }
  .title span { color: #0088bb; font-weight: 500; font-size: 9px; }
  .audioToggle { background: rgba(255,255,255,0.85); border: 1.5px solid rgba(0,170,220,0.5); border-radius: 8px; padding: 3px 7px; font-size: 13px; cursor: pointer; transition: all 0.2s; margin-left: auto; }
  .audioToggle:active { transform: scale(0.9); }
  .audioToggle.muted { opacity: 0.5; }
  .statPill { flex: 1; background: rgba(255,255,255,0.85); border: 1.5px solid rgba(0,170,220,0.5); border-radius: 8px; padding: 3px 5px; font-size: 8px; text-align: center; color: #01557a; font-weight: 600; }
  .statPill b { display: block; font-size: 11px; color: #0088bb; }
  .statPill.coin b { color: #d4a017; font-size: 10px; }
  #missionPanel { position: relative; z-index: 10; margin: 4px 8px 0; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(220,245,255,0.85)); border: 1.5px solid #33c1ff; border-radius: 10px; padding: 5px 8px; display: flex; align-items: center; gap: 6px; }
  #missionPanel .mIcon { font-size: 16px; }
  #missionPanel .mBody { flex: 1; }
  #missionPanel .mTitle { font-size: 9px; color: #0078a8; font-weight: 800; }
  #missionPanel .mDesc { font-size: 8px; color: #2a6a8a; margin-top: 1px; }
  #missionPanel .mProg { font-size: 9px; color: #00a878; font-weight: 800; }
  #missionPanel.complete { border-color: #00cc88; background: linear-gradient(135deg, #e6fff4, #c8ffec); }
  #eventPanel { position: relative; z-index: 10; margin: 3px 8px 0; background: linear-gradient(135deg, #fff4d0, #ffe8a0); border: 1.5px solid #e5a814; border-radius: 10px; padding: 4px 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #eventPanel .eIcon { font-size: 15px; }
  #eventPanel .eBody { flex: 1; }
  #eventPanel .eTitle { font-size: 9px; color: #7a5500; font-weight: 800; }
  #eventPanel .eDesc { font-size: 8px; color: #8a6a20; margin-top: 1px; }
  #eventPanel .eReward { font-size: 9px; color: #d4a017; font-weight: 800; }
  #envPanel { position: relative; z-index: 10; margin: 4px 8px 0; background: rgba(255,255,255,0.88); border: 1.5px solid rgba(0,170,220,0.4); border-radius: 10px; padding: 6px 8px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .envItem { text-align: center; }
  .envItem label { font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #2a7aa0; display: block; margin-bottom: 2px; font-weight: 700; }
  .bar { height: 6px; background: #d6ecf5; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 50%; border-radius: 4px; transition: width 0.4s; }
  .bar .tempFill { background: linear-gradient(90deg,#3ab8ff,#ffcc00); }
  .bar .phFill { background: linear-gradient(90deg,#ff5577,#3ddc97); }
  .bar .oxyFill { background: linear-gradient(90deg,#4a6cff,#00d9b0); }
  .envVal { font-size: 9px; color: #01557a; margin-top: 2px; display: block; font-weight: 700; }
  #trophicPanel { position: absolute; z-index: 10; bottom: 88px; left: 8px; right: 8px; background: rgba(255,255,255,0.85); border: 1.5px solid #33c1ff; border-radius: 12px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; max-height: 24vh; overflow-y: auto; }
  .trophicTitle { font-size: 8.5px; letter-spacing: 1.5px; color: #0077aa; text-transform: uppercase; font-weight: 800; display:flex; justify-content:space-between; align-items:center; margin-bottom: 2px; }
  .trophicTitle .infoBtn { background:transparent; border:none; color:#0088bb; font-size:9px; cursor:pointer; text-decoration:underline; font-weight: 700; }
  .levelRow { display: flex; align-items: center; gap: 5px; background: rgba(234,248,255,0.7); border: 1px solid #a8ddff; border-radius: 8px; padding: 3px 6px; cursor: pointer; height: 26px; }
  .levelRow.cant-afford { border-color: #ff4466; background: rgba(255,235,240,0.75); }
  .levelIcon { font-size: 15px; width: 18px; text-align: center; }
  .levelInfo { flex: 1; min-width: 0; }
  .levelName { font-size: 8.5px; color: #01557a; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .levelBar { height: 4px; background: #b8e2f5; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .levelBar > div { height: 100%; transition: width 0.4s; border-radius: 3px; }
  .levelPop { font-size: 10px; color: #00a878; font-weight: 800; min-width: 28px; text-align: right; }
  .levelBtns { display: flex; gap: 3px; }
  .lvlBtn { background: linear-gradient(180deg, #4dd2ff, #00a8e0); border: none; color: #ffffff; border-radius: 6px; font-size: 12px; font-weight: 800; width: 24px; height: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lvlBtn.minus { background: linear-gradient(180deg, #ff8899, #ee4466); }
  #bottomActions { position: absolute; z-index: 10; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 5px 6px 8px; background: linear-gradient(0deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.55) 60%, transparent 100%); }
  .actionBtn { background: linear-gradient(180deg, #ffffff, #e0f4ff); border: 1.5px solid #33c1ff; color: #01557a; border-radius: 10px; padding: 5px 2px; font-size: 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-align: center; line-height: 1.1; font-weight: 800; }
  .actionBtn .ico { font-size: 14px; }
  .actionBtn.quiz { background: linear-gradient(180deg, #fff8d0, #ffe680); border-color: #d4a017; color: #7a5500; }
  .actionBtn.rank { background: linear-gradient(180deg, #ffe6f0, #ffc8dd); border-color: #ff6699; color: #a0103a; }
  #logBox { position: absolute; z-index: 9; top: 205px; left: 8px; right: 8px; max-height: 55px; overflow: hidden; pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
  .logLine { font-size: 8px; color: #01557a; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 5px; border-left: 3px solid #33c1ff; font-weight: 600; }
  .logLine.good { border-left-color: #00cc88; color: #007a52; }
  .logLine.bad { border-left-color: #ff4466; color: #a0103a; }
  .logLine.warn { border-left-color: #ffaa00; color: #8a5500; }
  .logLine.coin { border-left-color: #d4a017; color: #7a5500; }
  .logLine.event { border-left-color: #ff6699; color: #a0103a; }
  #modal { position: absolute; inset: 0; z-index: 50; background: rgba(180,225,245,0.75); display: none; align-items: center; justify-content: center; padding: 20px; }
  #modal.show { display: flex; }
  .modalCard { background: linear-gradient(160deg, #ffffff, #e6f6ff); border: 3px solid #33c1ff; border-radius: 18px; padding: 18px; max-width: 440px; width: 100%; box-shadow: 0 8px 32px rgba(0,150,220,0.4); text-align: center; max-height: 88vh; overflow-y: auto; color: #01557a; }
  .modalCard h2 { font-size: 17px; color: #0088bb; margin-bottom: 8px; font-weight: 800; }
  .modalCard p { font-size: 11px; color: #2a6a8a; line-height: 1.55; margin-bottom: 12px; text-align: left; font-weight: 500; }
  .modalCard p.center { text-align: center; }
  .modalBtn { background: linear-gradient(180deg, #4dd2ff, #00a8e0); border: none; color: #ffffff; font-weight: 800; font-size: 11.5px; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin: 3px; }
  .modalBtn.secondary { background: linear-gradient(180deg, #ffffff, #d6ecf5); color: #0088bb; border: 2px solid #33c1ff; }
  .modalBtn.teacher { background: linear-gradient(180deg, #88aaff, #4477ff); color: #ffffff; }
  .modalBtn.gold { background: linear-gradient(180deg, #ffd966, #e5a814); color: #5a3c00; }
  .catGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .catCard { background: linear-gradient(180deg, #f0faff, #d6ecff); border: 2px solid #a8ddff; border-radius: 10px; padding: 10px 8px; cursor: pointer; text-align: center; }
  .catCard .cIcon { font-size: 22px; }
  .catCard .cName { font-size: 9.5px; color: #01557a; font-weight: 800; margin-top: 2px; }
  .catCard .cCount { font-size: 8px; color: #4a90b8; font-weight: 600; }
  .teacherStats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .tStat { background: linear-gradient(135deg, #f0faff, #d6ecff); border: 1.5px solid #a8ddff; border-radius: 10px; padding: 8px; text-align: center; }
  .tStat .tsVal { font-size: 18px; font-weight: 800; color: #0088bb; }
  .tStat .tsLabel { font-size: 8.5px; color: #2a6a8a; font-weight: 700; margin-top: 2px; }
  .studentRow { display: flex; align-items: center; gap: 6px; padding: 7px 9px; background: linear-gradient(180deg, #f0faff, #e0f4ff); border: 1.5px solid #b8e2ff; border-radius: 10px; margin-bottom: 4px; text-align: left; }
  .studentRow.top { background: linear-gradient(180deg, #fff8d0, #ffe680); border-color: #d4a017; }
  .sRank { font-size: 14px; font-weight: 800; min-width: 22px; text-align: center; color: #d4a017; }
  .sInfo { flex: 1; min-width: 0; }
  .sName { font-size: 10.5px; color: #01557a; font-weight: 800; }
  .sMeta { font-size: 8.5px; color: #4a90b8; }
  .sScore { text-align: right; }
  .sScore .sVal { font-size: 11px; color: #00a878; font-weight: 800; }
  .sScore .sSub { font-size: 8px; color: #d4a017; font-weight: 700; }
  .accuracyRow { display: flex; align-items: center; gap: 8px; padding: 6px 9px; background: #f0faff; border: 1.5px solid #b8e2ff; border-radius: 8px; margin-bottom: 4px; text-align: left; }
  .accIcon { font-size: 18px; }
  .accInfo { flex: 1; }
  .accName { font-size: 9.5px; color: #01557a; font-weight: 800; }
  .accBar { height: 5px; background: #d6ecf5; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .accBar > div { height: 100%; border-radius: 3px; }
  .accVal { font-size: 10.5px; font-weight: 800; color: #0088bb; min-width: 40px; text-align: right; }
  .rankRow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #f0faff, #e0f4ff); border: 1.5px solid #b8e2ff; border-radius: 10px; margin-bottom: 5px; text-align: left; }
  .rankRow.gold { background: linear-gradient(180deg, #fff8d0, #ffe680); border-color: #d4a017; }
  .rankRow.silver { background: linear-gradient(180deg, #f5f5f5, #e0e0e0); border-color: #a0a0a0; }
  .rankRow.bronze { background: linear-gradient(180deg, #ffe8d0, #ffcc99); border-color: #cc8844; }
  .rankRow.me { box-shadow: 0 0 0 2.5px #ff5577 inset; }
  .rankPos { font-size: 18px; font-weight: 800; width: 32px; text-align: center; color: #d4a017; }
  .rankName { flex: 1; font-size: 11px; color: #01557a; font-weight: 700; }
  .rankName small { display: block; font-size: 8px; color: #4a90b8; font-weight: 500; }
  .rankScore { font-size: 12px; font-weight: 800; color: #00a878; text-align: right; }
  .codexHeader { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #b8e2ff; }
  .codexIcon { font-size: 36px; }
  .codexTitle { text-align: left; }
  .codexTitle h2 { font-size: 15px; margin: 0; color: #0077aa; }
  .codexTitle .latin { font-size: 9px; font-style: italic; color: #4a90b8; }
  .codexSection { text-align: left; margin-bottom: 8px; }
  .codexSection h4 { font-size: 9px; color: #0088bb; text-transform: uppercase; margin-bottom: 3px; font-weight: 800; }
  .codexSection p { font-size: 10.5px; color: #2a5a75; line-height: 1.5; margin: 0; font-weight: 500; }
  .codexBadge { display: inline-block; font-size: 8.5px; padding: 2px 8px; border-radius: 10px; background: #d6f0ff; color: #0077aa; border: 1px solid #7fc9ec; margin-right: 4px; margin-bottom: 4px; font-weight: 700; }
  .codexFact { background: #e6fff4; border-left: 4px solid #00cc88; padding: 7px 9px; border-radius: 8px; font-size: 10px; color: #006644; margin-top: 6px; font-weight: 500; }
  .quizHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 7px 10px; background: linear-gradient(135deg, #fff8d0, #ffe680); border-radius: 8px; border: 2px solid #d4a017; }
  .quizHeader .qTitle { font-size: 10px; font-weight: 800; color: #7a5500; }
  .quizHeader .qReward { font-size: 10px; font-weight: 800; color: #d4a017; }
  .quizHeader .qCat { font-size: 8.5px; color: #7a5500; font-weight: 700; display:block; }
  .quizQuestion { font-size: 11.5px; color: #01557a; font-weight: 700; text-align: left; margin-bottom: 10px; line-height: 1.45; padding: 9px 11px; background: #f0faff; border-radius: 10px; border-left: 4px solid #33c1ff; }
  .quizOptions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .quizOpt { text-align: left; padding: 10px 12px; font-size: 11px; background: linear-gradient(180deg, #ffffff, #eaf8ff); border: 2px solid #a8ddff; border-radius: 10px; color: #01557a; font-weight: 600; cursor: pointer; }
  .quizOpt.correct { background: linear-gradient(180deg, #c8ffdd, #88ffbb); border-color: #00cc88; color: #005a3a; }
  .quizOpt.wrong { background: linear-gradient(180deg, #ffd0d8, #ffaabb); border-color: #ff4466; color: #7a0020; }
  .quizOpt.disabled { pointer-events: none; opacity: 0.7; }
  .quizFeedback { padding: 9px 11px; border-radius: 10px; font-size: 10.5px; text-align: left; line-height: 1.45; margin-bottom: 8px; font-weight: 600; }
  .quizFeedback.ok { background: #e6fff4; border-left: 4px solid #00cc88; color: #005a3a; }
  .quizFeedback.err { background: #ffe6ec; border-left: 4px solid #ff4466; color: #7a0020; }
  .quizProgress { display: flex; gap: 4px; justify-content: center; margin-bottom: 10px; }
  .quizProgress .dot { width: 8px; height: 8px; border-radius: 50%; background: #d6ecf5; }
  .quizProgress .dot.active { background: #33c1ff; transform: scale(1.3); }
  .quizProgress .dot.correct { background: #00cc88; }
  .quizProgress .dot.wrong { background: #ff4466; }
  .coinBurst { position: absolute; top: 50%; left: 50%; font-size: 28px; pointer-events: none; animation: burst 1.3s ease-out forwards; z-index: 100; font-weight: 800; color: #d4a017; text-shadow: 0 0 12px #ffd966; white-space: nowrap; }
  @keyframes burst { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1); } }
  #eventBanner { position: absolute; z-index: 30; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.8); background: linear-gradient(135deg,#ff5577,#ee2255); border: 3px solid #ffffff; border-radius: 16px; padding: 14px 20px; text-align: center; pointer-events: none; opacity: 0; transition: all 0.4s; max-width: 300px; }
  #eventBanner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #eventBanner h3 { font-size: 14px; color: #ffffff; margin-bottom: 4px; font-weight: 800; }
  #eventBanner p { font-size: 10.5px; color: #fff0f4; font-weight: 600; }
  #loginScreen { position: absolute; inset: 0; z-index: 200; background: linear-gradient(160deg, #a8ecff 0%, #7dd8f5 40%, #2a8fc4 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .loginCard { background: linear-gradient(160deg, #ffffff, #e6f6ff); border: 3px solid #33c1ff; border-radius: 20px; padding: 24px; max-width: 360px; width: 100%; box-shadow: 0 12px 40px rgba(0,80,140,0.35); text-align: center; }
  .loginCard h1 { font-size: 22px; color: #0088bb; margin-bottom: 4px; font-weight: 800; }
  .loginCard .subtitle { font-size: 10.5px; color: #4a90b8; margin-bottom: 16px; }
  .loginCard .emojiBig { font-size: 48px; margin-bottom: 6px; }
  .loginInput { width: 100%; padding: 12px 14px; font-size: 14px; border: 2px solid #a8ddff; border-radius: 12px; background: #f0faff; color: #01557a; font-weight: 700; margin-bottom: 10px; outline: none; text-align: center; }
  .loginInput:focus { border-color: #33c1ff; }
  .loginBtn { width: 100%; padding: 13px; background: linear-gradient(180deg, #4dd2ff, #00a8e0); border: none; color: #ffffff; font-weight: 800; font-size: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 6px; }
  .loginBtn.gold { background: linear-gradient(180deg, #ffd966, #e5a814); color: #5a3c00; }
  .loginInfo { font-size: 9.5px; color: #7a9ab8; margin-top: 10px; line-height: 1.5; }
  .loginRecent { font-size: 9px; color: #4a90b8; margin-top: 8px; }
  .loginRecent span { background: #e0f4ff; padding: 2px 8px; border-radius: 10px; margin: 2px; display: inline-block; cursor: pointer; font-weight: 700; color: #0088bb; border: 1px solid #a8ddff; }
  .achRow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #f0faff; border: 1.5px solid #b8e2ff; border-radius: 10px; margin-bottom: 5px; text-align: left; }
  .achRow.unlocked { background: linear-gradient(135deg, #e6fff4, #ccffee); border-color: #00cc88; }
  .achIcon { font-size: 22px; width: 30px; text-align: center; }
  .achBody { flex: 1; }
  .achTitle { font-size: 10.5px; color: #01557a; font-weight: 800; }
  .achDesc { font-size: 8.5px; color: #4a90b8; margin-top: 1px; }
  .achState { font-size: 9px; font-weight: 800; color: #00a878; }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap"></div>

  <div id="loginScreen">
    <div class="loginCard">
      <div class="emojiBig">🌊</div>
      <h1>AquaBalance</h1>
      <div class="subtitle">Bright Reef Protocol — Classroom Edition</div>
      <input type="text" class="loginInput" id="loginInput" placeholder="Masukkan nama kamu..." maxlength="20" autocomplete="off">
      <button class="loginBtn" id="loginStudent">🚀 MULAI MENYELAM</button>
      <button class="loginBtn gold" id="loginTeacher">👩‍🏫 DASHBOARD GURU</button>
      <div class="loginRecent" id="loginRecent"></div>
      <div class="loginInfo">💡 Data progres disimpan otomatis per nama siswa.</div>
    </div>
  </div>

  <div id="topHUD">
    <div class="hudRow">
      <div class="title">🌊 AQUABALANCE <span id="userNameLabel">Penjaga Laut</span></div>
      <button class="audioToggle" id="audioToggle" title="Toggle Suara">🔊</button>
    </div>
    <div class="hudRow">
      <div class="statPill">Hari<b id="statDay">1</b></div>
      <div class="statPill">Energi<b id="statEnergy">100</b></div>
      <div class="statPill">Biodiv<b id="statBio">0%</b></div>
      <div class="statPill coin" id="coinPill">💰 Saldo<b id="statCoin">Rp 0</b></div>
    </div>
  </div>

  <div id="missionPanel">
    <div class="mIcon" id="mIcon">🎯</div>
    <div class="mBody">
      <div class="mTitle" id="mTitle">Misi 1</div>
      <div class="mDesc" id="mDesc">-</div>
    </div>
    <div class="mProg" id="mProg">0/1</div>
  </div>

  <div id="eventPanel">
    <div class="eIcon" id="eIcon">🎪</div>
    <div class="eBody">
      <div class="eTitle" id="eTitle">Event Hari Ini</div>
      <div class="eDesc" id="eDesc">-</div>
    </div>
    <div class="eReward" id="eReward">+Rp 0</div>
  </div>

  <div id="envPanel">
    <div class="envItem"><label>Suhu</label><div class="bar"><div class="tempFill" id="tempBar"></div></div><span class="envVal" id="tempVal">26°C</span></div>
    <div class="envItem"><label>pH</label><div class="bar"><div class="phFill" id="phBar"></div></div><span class="envVal" id="phVal">8.1</span></div>
    <div class="envItem"><label>Oksigen</label><div class="bar"><div class="oxyFill" id="oxyBar"></div></div><span class="envVal" id="oxyVal">80%</span></div>
  </div>

  <div id="logBox"></div>

  <div id="trophicPanel">
    <div class="trophicTitle">
      <span>⚡ Piramida Energi</span>
      <button class="infoBtn" id="btnInfo">ℹ️ Codex</button>
    </div>
    <div id="levelsContainer"></div>
  </div>

  <div id="bottomActions">
    <button class="actionBtn" id="btnPhotosyn"><span class="ico">☀️</span>Sinar</button>

<script type="module">
import * as THREE from 'three';

const AudioEngine = {
  ctx: null, masterGain: null, musicGain: null, sfxGain: null,
  musicPlaying: false, musicNodes: [], muted: false, musicTimeout: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.6; this.masterGain.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.12; this.musicGain.connect(this.masterGain);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.5; this.sfxGain.connect(this.masterGain);
    } catch(e) { console.warn('Audio init failed', e); }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) { this.muted = m; if (this.masterGain) this.masterGain.gain.value = m ? 0 : 0.6; },
  tone(freq, duration, type = 'sine', gainVal = 0.3, startDelay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + startDelay;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(gainVal, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain); gain.connect(this.sfxGain);
    osc.start(t); osc.stop(t + duration + 0.05);
  },
  playCorrect() { this.init(); this.resume(); this.tone(880, 0.15, 'sine', 0.35); this.tone(1320, 0.2, 'sine', 0.25, 0.08); },
  playWrong() { this.init(); this.resume(); this.tone(180, 0.25, 'sawtooth', 0.3); this.tone(120, 0.3, 'sawtooth', 0.25, 0.05); },
  playCoin() { this.init(); this.resume(); this.tone(1046, 0.08, 'square', 0.25); this.tone(1568, 0.15, 'square', 0.2, 0.06); },
  playBuy() { this.init(); this.resume(); this.tone(440, 0.08, 'triangle', 0.3); this.tone(660, 0.12, 'triangle', 0.25, 0.05); },
  playFanfare() { this.init(); this.resume(); [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.3, 'sine', 0.3, i * 0.1)); this.tone(1568, 0.5, 'sine', 0.25, 0.45); },
  playAlert() { this.init(); this.resume(); this.tone(300, 0.15, 'sawtooth', 0.35); this.tone(400, 0.15, 'sawtooth', 0.35, 0.2); this.tone(300, 0.25, 'sawtooth', 0.35, 0.4); },
  playVictory() { this.init(); this.resume(); [523, 523, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.3, i * 0.15)); this.tone(1318, 0.7, 'triangle', 0.25, 1.0); },
  playFail() { this.init(); this.resume(); this.tone(440, 0.3, 'sine', 0.3); this.tone(330, 0.4, 'sine', 0.28, 0.25); this.tone(220, 0.8, 'sine', 0.25, 0.55); },
  startMusic() {
    this.init(); this.resume();
    if (!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    const chords = [[261.63, 329.63, 392.00], [220.00, 277.18, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
    let idx = 0;
    const playChord = () => {
      if (!this.musicPlaying || this.muted) return;
      const chord = chords[idx % chords.length]; idx++;
      chord.forEach((f, i) => {
        const t = this.ctx.currentTime + i * 0.15;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.15, t + 1);
        gain.gain.linearRampToValueAtTime(0.12, t + 2.5);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 4);
        osc.connect(gain); gain.connect(this.musicGain);
        osc.start(t); osc.stop(t + 4);
        this.musicNodes.push(osc);
      });
      if (this.musicPlaying) this.musicTimeout = setTimeout(playChord, 4000);
    };
    playChord();
  },
  stopMusic() {
    this.musicPlaying = false;
    if (this.musicTimeout) clearTimeout(this.musicTimeout);
    this.musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    this.musicNodes = [];
  }
};

function getCategoryStats() {

const QUIZ_REWARDS = { correct: 2000, wrong: 500, perfectBonus: 5000, streak3Bonus: 2500 };
const QUESTIONS_PER_SESSION = 5;
function shuffleArr(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function getQuizQuestions(cat, n) { let pool = QUIZ_BANK; if (cat && cat !== 'mixed') pool = QUIZ_BANK.filter(q => q.cat === cat); return shuffleArr(pool).slice(0, Math.min(n, pool.length)); }

let quizSession = null;

function showQuizMenu() {
  const maxReward = QUESTIONS_PER_SESSION * QUIZ_REWARDS.correct + QUIZ_REWARDS.perfectBonus;
  const catCards = CATEGORIES.map(c => {
    const count = QUIZ_BANK.filter(q => q.cat === c.id).length;
    const st = (state.categoryStats && state.categoryStats[c.id]) || { total: 0, correct: 0 };
    const acc = st.total > 0 ? Math.round(st.correct / st.total * 100) : 0;
    return `<div class="catCard" data-cat="${c.id}"><div class="cIcon">${c.icon}</div><div class="cName">${c.name}</div><div class="cCount">${count} soal${st.total > 0 ? ` • ${acc}%` : ''}</div></div>`;
  }).join('');
  const html = `<p class="center" style="font-size:11px;"><b>📝 Pilih Kategori Kuis</b></p><div class="catGrid">${catCards}</div><button class="modalBtn" id="btnMixed" style="width:100%;background:linear-gradient(180deg,#ffe680,#ffcc33);color:#7a5500;font-weight:800;padding:12px;margin-top:6px;">🎲 Campur Semua (${QUIZ_BANK.length} soal)</button><div style="margin-top:10px;padding:8px;background:#f0faff;border-radius:8px;text-align:left;font-size:9.5px;color:#2a6a8a;">✅ Benar: +${formatRupiah(QUIZ_REWARDS.correct)} • ❌ Salah: +${formatRupiah(QUIZ_REWARDS.wrong)}<br>💰 Maks: <b>${formatRupiah(maxReward)}</b></div>`;
  showModal('📚 Menu Kuis', html, 'TUTUP');
  setTimeout(() => {
    modalText.querySelectorAll('.catCard').forEach(card => { card.onclick = () => { modal.classList.remove('show'); startQuizSession(card.dataset.cat); }; });
    const btnMix = document.getElementById('btnMixed');
    if (btnMix) btnMix.onclick = () => { modal.classList.remove('show'); startQuizSession('mixed'); };
  }, 50);
}
function startQuizSession(cat) {
  quizSession = { category: cat, questions: getQuizQuestions(cat, QUESTIONS_PER_SESSION), index: 0, correct: 0, wrong: 0, streak: 0, coinsEarned: 0, answers: [] };
  state.perfectThisSession = false; state.extra.perfectThisSession = false;
  renderQuizQuestion();
}
function renderQuizQuestion() {
  if (!quizSession) return;
  if (quizSession.index >= quizSession.questions.length) { finishQuizSession(); return; }
  const q = quizSession.questions[quizSession.index];
  const optionsHTML = q.o.map((opt, i) => `<button class="quizOpt" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`).join('');
  const dots = quizSession.questions.map((_, i) => { let cls = 'dot'; if (i < quizSession.index) cls += quizSession.answers[i].correct ? ' correct' : ' wrong'; if (i === quizSession.index) cls += ' active'; return `<div class="${cls}"></div>`; }).join('');
  const html = `<div class="quizHeader"><div><div class="qTitle">Soal ${quizSession.index + 1}/${quizSession.questions.length}</div><div class="qCat">📚 ${quizSession.category === 'mixed' ? 'Campur' : quizSession.category}</div></div><div class="qReward">💰 ${formatRupiah(quizSession.coinsEarned)}</div></div><div class="quizProgress">${dots}</div><div class="quizQuestion">${q.q}</div><div class="quizOptions">${optionsHTML}</div><div id="quizFeedback"></div>`;
  modalTitle.textContent = '📝 Kuis';
  modalText.innerHTML = html;
  modalActions.style.display = 'none';
  modal.classList.add('show');
  setTimeout(() => { modalText.querySelectorAll('.quizOpt').forEach(btn => { btn.onclick = () => answerQuiz(parseInt(btn.dataset.idx)); }); }, 30);
}
function answerQuiz(idx) {
  const q = quizSession.questions[quizSession.index];
  const correctIdx = q.a;
  const isCorrect = idx === correctIdx;
  state.quizStats.total++;
  getCategoryStats();
  if (!state.categoryStats[q.cat]) state.categoryStats[q.cat] = { total: 0, correct: 0 };
  state.categoryStats[q.cat].total++;
  let reward;
  if (isCorrect) {
    state.quizStats.correct++;
    state.categoryStats[q.cat].correct++;
    quizSession.correct++;
    quizSession.streak++;
    state.quizStreak++;
    state.extra.quizStreak = state.quizStreak;
    reward = QUIZ_REWARDS.correct;
    if (quizSession.streak === 3) reward += QUIZ_REWARDS.streak3Bonus;
    AudioEngine.playCorrect();
  } else {
    state.quizStats.wrong++;
    quizSession.wrong++;
    quizSession.streak = 0;
    state.quizStreak = 0;
    state.extra.quizStreak = 0;
    reward = QUIZ_REWARDS.wrong;
    AudioEngine.playWrong();
  }
  quizSession.coinsEarned += reward;
  quizSession.answers.push({ correct: isCorrect, cat: q.cat });
  const opts = modalText.querySelectorAll('.quizOpt');
  opts.forEach((btn, i) => { btn.classList.add('disabled'); if (i === correctIdx) btn.classList.add('correct'); else if (i === idx) btn.classList.add('wrong'); });
  const feedback = document.getElementById('quizFeedback');
  feedback.innerHTML = `<div class="quizFeedback ${isCorrect ? 'ok' : 'err'}">${isCorrect ? '✅ <b>Benar!</b>' : '❌ <b>Belum tepat.</b>'} +${formatRupiah(reward)}<br><span style="font-size:10px;font-weight:500;">💡 ${q.exp}</span></div><div style="text-align:center;margin-top:8px;"><button class="modalBtn" id="quizNext">${quizSession.index + 1 < quizSession.questions.length ? 'SOAL BERIKUTNYA →' : 'LIHAT HASIL 🏁'}</button></div>`;
  document.getElementById('quizNext').onclick = () => { quizSession.index++; renderQuizQuestion(); };
}
function finishQuizSession() {
  const qs = quizSession;
  const perfect = qs.correct === qs.questions.length;
  if (perfect) { qs.coinsEarned += QUIZ_REWARDS.perfectBonus; state.hasPerfect = true; state.perfectThisSession = true; state.extra.perfectThisSession = true; }
  state.quizSessionsToday = (state.quizSessionsToday || 0) + 1;
  state.extra.quizSessionsToday = state.quizSessionsToday;
  state.coins += qs.coinsEarned;
  state.totalEarned += qs.coinsEarned;
  moneyBurst(qs.coinsEarned);
  if (perfect) AudioEngine.playFanfare();
  const accuracy = Math.round((qs.correct / qs.questions.length) * 100);
  let grade = 'C', emoji = '😐';
  if (accuracy === 100) { grade = 'S'; emoji = '🏆'; } else if (accuracy >= 80) { grade = 'A'; emoji = '🌟'; } else if (accuracy >= 60) { grade = 'B'; emoji = '👍'; } else if (accuracy >= 40) { grade = 'C'; emoji = '😐'; } else { grade = 'D'; emoji = '💪'; }
  const catBreakdown = {};
  qs.answers.forEach(a => { if (!catBreakdown[a.cat]) catBreakdown[a.cat] = { c: 0, t: 0 }; catBreakdown[a.cat].t++; if (a.correct) catBreakdown[a.cat].c++; });
  let catHTML = '';
  Object.entries(catBreakdown).forEach(([cat, v]) => { catHTML += `<div style="display:flex;justify-content:space-between;font-size:9.5px;color:#4a90b8;padding:2px 0;"><span>${cat}</span><span><b>${v.c}/${v.t}</b></span></div>`; });
  const html = `<div style="text-align:center;"><div style="font-size:44px;margin-bottom:4px;">${emoji}</div><h2 style="color:#0088bb;margin-bottom:8px;">Hasil Kuis</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;"><div style="background:#e6fff4;padding:7px;border-radius:8px;border:1.5px solid #00cc88;"><div style="font-size:8.5px;color:#007a52;font-weight:700;">BENAR</div><div style="font-size:17px;color:#00a878;font-weight:800;">${qs.correct}</div></div><div style="background:#ffe6ec;padding:7px;border-radius:8px;border:1.5px solid #ff4466;"><div style="font-size:8.5px;color:#a0103a;font-weight:700;">SALAH</div><div style="font-size:17px;color:#d1325a;font-weight:800;">${qs.wrong}</div></div><div style="background:#fff8d0;padding:7px;border-radius:8px;border:1.5px solid #d4a017;"><div style="font-size:8.5px;color:#7a5500;font-weight:700;">NILAI</div><div style="font-size:17px;color:#d4a017;font-weight:800;">${grade}</div></div></div>${catHTML ? `<div style="background:#f0faff;padding:8px;border-radius:8px;margin-bottom:10px;">${catHTML}</div>` : ''}<div style="background:linear-gradient(135deg,#fff8d0,#ffe680);padding:10px;border-radius:10px;border:2px solid #d4a017;margin-bottom:10px;"><div style="font-size:10.5px;color:#7a5500;font-weight:700;">💰 Saldo Didapat</div><div style="font-size:20px;color:#d4a017;font-weight:800;">+${formatRupiah(qs.coinsEarned)}</div>${perfect ? `<div style="font-size:9.5px;color:#00a878;font-weight:800;margin-top:4px;">✨ PERFECT +${formatRupiah(QUIZ_REWARDS.perfectBonus)} ✨</div>` : ''}</div><button class="modalBtn" id="quizDone">SELESAI</button></div>`;
  modalTitle.textContent = '🏁 Hasil Kuis';
  modalText.innerHTML = html;
  modalActions.style.display = 'none';
  modal.classList.add('show');
  updateUI();
  addLog(`📝 Kuis: ${qs.correct}/${qs.questions.length}, +${formatRupiah(qs.coinsEarned)}`, 'coin');
  saveUserState();
  document.getElementById('quizDone').onclick = () => { modal.classList.remove('show'); modalActions.style.display = 'flex'; quizSession = null; checkMission(); checkEvent(); checkAchievements(); };
}

function pickDailyEvent() {
  let pool = EVENT_TYPES.filter(e => !state.currentEvent || e.id !== state.currentEvent.id);
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  state.currentEvent = chosen;
  state.eventCompleted = false;
  state.extra.quizStreak = 0; state.extra.perfectThisSession = false; state.extra.quizSessionsToday = 0;
  state.quizSessionsToday = 0;

function updateEventPanel() {
  if (!state.currentEvent) return;
  const e = state.currentEvent;
  document.getElementById('eIcon').textContent = e.icon;
  document.getElementById('eTitle').textContent = e.title;
  document.getElementById('eDesc').textContent = state.eventCompleted ? '✅ Selesai! Reward sudah diterima.' : e.desc;

  const panel = document.getElementById('eventPanel');
  if (state.eventCompleted) { panel.style.background = 'linear-gradient(135deg, #e6fff4, #ccffee)'; panel.style.borderColor = '#00cc88'; }
  else { panel.style.background = 'linear-gradient(135deg, #fff4d0, #ffe8a0)'; panel.style.borderColor = '#e5a814'; }
}
function checkEvent() {
  if (!state.currentEvent || state.eventCompleted) return;
  const e = state.currentEvent;

function exportToCSV(allSaves) {
  const headers = ['Nama', 'Skor', 'Hari', 'Saldo (Rp)', 'Biodiversitas (%)', 'Total Soal', 'Benar', 'Salah', 'Akurasi (%)',
    ...CATEGORIES.map(c => `${c.name} Benar`), ...CATEGORIES.map(c => `${c.name} Total`), ...CATEGORIES.map(c => `${c.name} Akurasi (%)`)];
  const rows = [headers];
  allSaves.forEach(s => {
    const d = s.data;
    const quiz = d.quizStats || { total: 0, correct: 0, wrong: 0 };
    const acc = quiz.total > 0 ? Math.round(quiz.correct / quiz.total * 100) : 0;
    const cs = d.categoryStats || {};
    const catBenar = CATEGORIES.map(c => (cs[c.id] && cs[c.id].correct) || 0);
    const catTotal = CATEGORIES.map(c => (cs[c.id] && cs[c.id].total) || 0);
    const catAcc = CATEGORIES.map((c, i) => { const t = catTotal[i]; const b = catBenar[i]; return t > 0 ? Math.round(b / t * 100) : 0; });
    rows.push([s.name, d.score || 0, d.day || 0, d.coins || 0, d.biodiversity || 0, quiz.total, quiz.correct, quiz.wrong, acc, ...catBenar, ...catTotal, ...catAcc]);
  });
  const csv = rows.map(r => r.map(cell => { const str = String(cell); if (str.includes(',') || str.includes('"')) return '"' + str.replace(/"/g, '""') + '"'; return str; }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aquabalance_laporan_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function buildBranchingCoral(x, z, scale, color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, emissive: color, emissiveIntensity: 0.08 });
  const tipMat = new THREE.MeshStandardMaterial({ color: 0xfff0ff, roughness: 0.6, emissive: 0xff88bb, emissiveIntensity: 0.15 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.6, 8), mat); trunk.position.y = 0.3; g.add(trunk);
  function addBranch(px, py, pz, dirX, dirZ, len, depth) {
    if (depth <= 0) return;
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.07, len, 6), mat);
    b.position.set(px + dirX*len/2, py + len/2, pz + dirZ*len/2);
    b.lookAt(px + dirX*len, py + len, pz + dirZ*len); b.rotateX(Math.PI/2); g.add(b);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), tipMat);
    tip.position.set(px + dirX*len, py + len, pz + dirZ*len); g.add(tip);
    const nx = px + dirX*len, ny = py + len, nz = pz + dirZ*len;
    for (let i = 0; i < 2; i++) { const ang = (Math.random() - 0.5) * Math.PI; addBranch(nx, ny, nz, Math.cos(ang)*0.4, Math.sin(ang)*0.4, len*0.7, depth-1); }
  }
  for (let i = 0; i < 3; i++) { const a = (i/3)*Math.PI*2 + Math.random()*0.5; addBranch(0, 0.5, 0, Math.cos(a)*0.4, Math.sin(a)*0.4, 0.4, 3); }
  g.position.set(x, 0, z); g.scale.setScalar(scale); scene.add(g); return g;
}

  const g = new THREE.Group();

  pos.needsUpdate = true; geo.computeVertexNormals();

}
function buildFanCoral(x, z, scale, color) {

}

function syncFishMeshes() {
  for (const lvl of TROPHIC_LEVELS) {
    const target = Math.min(state.populations[lvl.id], 20);
    const arr = fishMeshes[lvl.id];
    while (arr.length < target) arr.push(createFishMesh(lvl.id));
    while (arr.length > target) { const m = arr.pop(); scene.remove(m); m.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  }
}

function calcBiodiversity() {
  let filled = 0;
  for (const lvl of TROPHIC_LEVELS) if (state.populations[lvl.id] > 0) filled++;
  const popRatio = TROPHIC_LEVELS.reduce((s,l) => s + Math.min(state.populations[l.id]/l.max, 1), 0) / 4;
  state.biodiversity = Math.round((filled/4)*60 + popRatio*40);
}
function updatePopulations() {
  const envFactor = Math.max(0.3, 1.0 - state.pollution * 0.5 - state.env.turbidity * 0.005);
  for (const lvl of TROPHIC_LEVELS) {
    const pop = state.populations[lvl.id];
    if (pop <= 0) continue;
    const growth = Math.floor((Math.random() - 0.4) * pop * 0.1 * envFactor);
    state.populations[lvl.id] = Math.max(0, Math.min(lvl.max, pop + growth));
  }
  calcBiodiversity();
}
function updateEnvironment() {
  state.env.temp = Math.max(18, Math.min(36, state.env.temp + (state.pollution * 0.15) + (Math.random()-0.5)*0.2));
  state.env.ph = Math.max(6.5, Math.min(9.0, state.env.ph - state.pollution * 0.02 + (Math.random()-0.5)*0.04));
  state.env.oxygen = Math.max(10, Math.min(120, state.env.oxygen + state.populations.prod * 0.1 - 0.5));
  state.env.turbidity = Math.max(0, Math.min(100, state.env.turbidity + state.pollution * 0.5 - state.populations.prod * 0.02));
  state.sunlight = Math.max(0.15, 1.0 - state.env.turbidity * 0.006);
  state.pollution = Math.max(0, state.pollution * 0.97);
}

const eventTitleEl = document.getElementById('eventTitle');
const eventDescEl = document.getElementById('eventDesc');
function showEventBanner(title, desc) {
  eventTitleEl.textContent = title;
  eventDescEl.textContent = desc;
  eventBanner.classList.add('show');
  setTimeout(() => eventBanner.classList.remove('show'), 2600);
}
function recordHistory() {
  state.history.push({ day: state.day, prod: state.populations.prod, herb: state.populations.herb, carn: state.populations.carn, apex: state.populations.apex });
  if (state.history.length > 60) state.history.shift();
}
const mIcon = document.getElementById('mIcon');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const mProg = document.getElementById('mProg');
const missionPanel = document.getElementById('missionPanel');
function updateMission() {
  if (state.currentMission >= MISSIONS.length) {
    mIcon.textContent = '🏅'; mTitle.textContent = 'Semua Misi Selesai!';
    mDesc.textContent = 'Anda telah menyelesaikan seluruh pembelajaran.';
    mProg.textContent = '✓'; missionPanel.classList.add('complete'); return;
  }
  const m = MISSIONS[state.currentMission];
  mIcon.textContent = m.icon; mTitle.textContent = m.title; mDesc.textContent = m.desc; mProg.textContent = m.progress(state);
  if (m.check(state)) missionPanel.classList.add('complete'); else missionPanel.classList.remove('complete');
}
function checkMission() {
  if (state.currentMission >= MISSIONS.length) return;
  const m = MISSIONS[state.currentMission];
  if (m.check(state)) {
    state.missionCompleted.push(m.id);
    state.energy += m.reward; state.score += m.reward;
    state.coins += m.rewardRp; state.totalEarned += m.rewardRp;
    moneyBurst(m.rewardRp);
    AudioEngine.playFanfare();
    addLog(`✅ MISI: ${m.title}`, 'good');
    setTimeout(() => { showModal(`✅ ${m.title}`, `<p class="center" style="font-size:11.5px;"><b>🎓 Pembelajaran:</b><br>${m.learn}</p><p class="center" style="color:#00a878;font-weight:800;">+${m.reward}⚡ +${formatRupiah(m.rewardRp)} 💰</p>`, 'LANJUT', () => { state.currentMission++; updateMission(); }); }, 400);
    saveUserState();
  }
}
function nextDay() {
  if (state.gameOver) return;
  state.day++;
  updateEnvironment(); updatePopulations(); rollDisaster(); recordHistory();
  inflatePrices();
  state.energy = Math.min(999, state.energy + Math.floor(5 + state.biodiversity * 0.2));
  state.score += Math.floor(state.biodiversity * 0.5 + state.populations.prod*0.05);
  checkMission(); checkAchievements();
  pickDailyEvent();
  if (state.biodiversity >= 80 && state.populations.apex > 0 && state.day > 15) {
    state.gameOver = true;
    submitScore(); saveUserState();
    AudioEngine.playVictory();
    showModal('🏆 KEMENANGAN!', `<p class="center">Anda berhasil memulihkan ekosistem laut!<br><br>Hari: ${state.day}<br>Biodiversitas: ${state.biodiversity}%<br>Skor: ${state.score}</p>`, 'MAIN LAGI', () => resetGame());
  }
  updateUI(); saveUserState();
}
function actionPhotosyn() {
  if (state.energy < 15) { addLog('Energi tidak cukup!', 'bad'); return; }
  state.energy -= 15;
  state.sunlight = Math.min(1.5, state.sunlight + 0.3);
  state.env.turbidity = Math.max(0, state.env.turbidity - 15);
  addLog('Sinar matahari ditingkatkan.', 'good');
  nextDay();
}
function actionFilter() {
  if (state.energy < 25) { addLog('Energi tidak cukup!', 'bad'); return; }
  state.energy -= 25;
  state.pollution = Math.max(0, state.pollution - 0.35);
  state.env.turbidity = Math.max(0, state.env.turbidity - 25);
  state.env.ph = Math.min(8.4, state.env.ph + 0.2);
  addLog('Filter air aktif.', 'good');
  nextDay();
}
function actionRestock() {
  if (state.energy < 20) { addLog('Energi tidak cukup!', 'bad'); return; }
  state.energy -= 20;
  state.populations.prod = Math.min(TROPHIC_LEVELS[0].max, state.populations.prod + 10);
  state.populations.herb = Math.min(TROPHIC_LEVELS[1].max, state.populations.herb + 3);
  addLog('Restock berhasil.', 'good');
  nextDay();
}
function resetGame() {
  state.day = 1; state.energy = 100; state.score = 0; state.coins = 50000;
  state.populations = { prod: 10, herb: 4, carn: 1, apex: 0 };
  state.env = { temp: 26, ph: 8.1, oxygen: 80, turbidity: 15 };
  state.sunlight = 1.0; state.pollution = 0; state.biodiversity = 0;
  state.gameOver = false; state.log = [];
  state.currentMission = 0; state.missionCompleted = []; state.history = [];
  state.quizStats = { total: 0, correct: 0, wrong: 0 };
  state.categoryStats = {};
  state.quizPool = []; state.priceInflation = 1.0;
  state.totalSpent = 0; state.totalEarned = 0; state.hasPerfect = false;
  state.currentEvent = null; state.eventCompleted = false;
  state.quizStreak = 0; state.quizSessionsToday = 0;
  state.extra = { quizStreak: 0, perfectThisSession: false, quizSessionsToday: 0 };
  logBox.innerHTML = '';
  syncFishMeshes(); calcBiodiversity(); recordHistory();
  pickDailyEvent();
  updateUI(); updateMission();
  addLog('Kubah direset.', '');
  saveUserState();
}

const levelsContainer = document.getElementById('levelsContainer');
function buildLevelUI() {
  levelsContainer.innerHTML = '';
  TROPHIC_LEVELS.forEach(lvl => {
    const row = document.createElement('div');
    row.className = 'levelRow'; row.dataset.lvl = lvl.id;
    row.innerHTML = `<div class="levelIcon">${lvl.icon}</div><div class="levelInfo"><div class="levelName">${lvl.name} <span style="color:#d1325a;font-size:8px;" id="price_${lvl.id}">${compactRp(getPrice(lvl.id))}</span></div><div class="levelBar"><div style="width:0%;background:${lvl.color}" id="bar_${lvl.id}"></div></div></div><div class="levelPop" id="pop_${lvl.id}">0</div><div class="levelBtns"><button class="lvlBtn minus" data-lvl="${lvl.id}" data-act="minus">−</button><button class="lvlBtn" data-lvl="${lvl.id}" data-act="plus">+</button></div>`;
    row.addEventListener('click', (e) => { if (e.target.closest('.lvlBtn')) return; showCodex(lvl.id); });
    levelsContainer.appendChild(row);
  });
  levelsContainer.querySelectorAll('.lvlBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const lvlId = btn.dataset.lvl; const act = btn.dataset.act;
      const lvl = TROPHIC_LEVELS.find(l => l.id === lvlId);
      const energyCost = lvl.baseCost; const rupiahCost = getPrice(lvlId);
      if (act === 'plus') {
        if (state.energy < energyCost) { addLog('Energi kurang!', 'bad'); return; }
        if (state.coins < rupiahCost) {
          showModal('💸 SALDO TIDAK CUKUP', `<p class="center">Butuh <b>${formatRupiah(rupiahCost)}</b> untuk <b>${lvl.name}</b>.</p><p class="center">Saldo: <b style="color:#d1325a;">${formatRupiah(state.coins)}</b></p><p class="center" style="font-size:10.5px;">💡 Main kuis untuk dapat saldo!</p>`, 'MAIN KUIS', () => { modal.classList.remove('show'); showQuizMenu(); }, true, null);
          return;
        }
        if (state.populations[lvlId] >= lvl.max) { addLog(`${lvl.name} sudah maksimal!`, 'warn'); return; }
        state.energy -= energyCost; state.coins -= rupiahCost; state.totalSpent += rupiahCost;
        const add = lvlId === 'prod' ? 10 : lvlId === 'herb' ? 4 : 1;
        state.populations[lvlId] = Math.min(lvl.max, state.populations[lvlId] + add);
        addLog(`+${add} ${lvl.name} (−${formatRupiah(rupiahCost)})`, 'good');
        AudioEngine.playBuy();
      } else {
        if (state.populations[lvlId] <= 0) { addLog(`${lvl.name} kosong.`, 'warn'); return; }
        state.energy += Math.floor(energyCost * 0.5);
        state.coins += Math.floor(rupiahCost * 0.5);
        const rem = lvlId === 'prod' ? 10 : lvlId === 'herb' ? 4 : 1;
        state.populations[lvlId] = Math.max(0, state.populations[lvlId] - rem);
        addLog(`−${rem} ${lvl.name}`, 'warn');
      }
      syncFishMeshes(); updateUI(); checkMission(); saveUserState();
    });
  });
}
buildLevelUI();

const phBar = document.getElementById('phBar');
const oxyBar = document.getElementById('oxyBar');

function updateUI() {
  calcBiodiversity();
  statDay.textContent = state.day;
  statEnergy.textContent = Math.floor(state.energy);
  statBio.textContent = state.biodiversity + '%';
  statCoin.textContent = formatRupiah(state.coins);
  document.getElementById('userNameLabel').textContent = state.playerName;
  tempBar.style.width = Math.max(0, Math.min(100, ((state.env.temp - 18) / 18) * 100)) + '%';
  tempVal.textContent = state.env.temp.toFixed(1) + '°C';
  phBar.style.width = Math.max(0, Math.min(100, ((state.env.ph - 6.5) / 2.5) * 100)) + '%';
  phVal.textContent = state.env.ph.toFixed(2);
  oxyBar.style.width = Math.max(0, Math.min(100, (state.env.oxygen / 120) * 100)) + '%';

  TROPHIC_LEVELS.forEach(lvl => {

    const popEl = document.getElementById('pop_' + lvl.id);

    if (bar) bar.style.width = pct + '%';
    if (popEl) popEl.textContent = pop;

    if (row) { row.classList.remove('cant-afford'); if (state.coins < getPrice(lvl.id)) row.classList.add('cant-afford'); }
  });
  updateMission(); updateEventPanel();
}

function showChart() {
  const hist = state.history.length > 0 ? state.history : [{day:1, prod:state.populations.prod, herb:state.populations.herb, carn:state.populations.carn, apex:state.populations.apex}];
  const W = 600, H = 260;
  const maxDay = Math.max(hist[hist.length-1].day, 2);
  const maxVal = Math.max(...hist.map(h => Math.max(h.prod, h.herb, h.carn, h.apex)), 20);
  const plot = (key) => hist.map((h, i) => `${(h.day/maxDay)*W},${H - (h[key]/maxVal)*H*0.9 - H*0.05}`).map((p, i) => (i === 0 ? 'M' : 'L') + p).join(' ');
  const html = `<p class="center" style="margin-bottom:6px;color:#2a6a8a;">📊 Populasi Hari 1 → ${state.day}</p><div style="background:#f0faff;border-radius:10px;padding:8px;border:1.5px solid #b8e2ff;"><svg width="100%" height="200" viewBox="0 0 ${W} ${H}" style="display:block;"><rect width="${W}" height="${H}" fill="#f0faff"/><path d="${plot('prod')}" stroke="#00cc88" stroke-width="3" fill="none"/><path d="${plot('herb')}" stroke="#0088bb" stroke-width="3" fill="none"/><path d="${plot('carn')}" stroke="#e58a00" stroke-width="3" fill="none"/><path d="${plot('apex')}" stroke="#d1325a" stroke-width="3" fill="none"/></svg></div><div style="display:flex;justify-content:center;gap:10px;font-size:9px;margin-top:6px;font-weight:700;"><span style="color:#00a878;">🟢 Produsen</span><span style="color:#0088bb;">🔵 Herbivora</span><span style="color:#e58a00;">🟡 Karnivora</span><span style="color:#d1325a;">🔴 Apex</span></div>`;
  showModal('📊 Statistik', html, 'TUTUP');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(); const t = clock.getElapsedTime();
  for (const lvl of TROPHIC_LEVELS) {
    for (const fish of fishMeshes[lvl.id]) {
      const ud = fish.userData;
      ud.angle += dt * ud.speed * 0.5;
      const r = ud.orbitR;
      fish.position.x = Math.cos(ud.angle) * r;
      fish.position.z = Math.sin(ud.angle) * r;
      fish.position.y = ud.yBase + Math.sin(t * ud.ySpeed + ud.yPhase) * 1.2;
      fish.rotation.y = Math.atan2(-Math.cos(ud.angle), -Math.sin(ud.angle)) + Math.PI/2;
      fish.rotation.z = Math.sin(t * ud.ySpeed + ud.yPhase) * 0.15;
      const dy = Math.cos(t * ud.ySpeed + ud.yPhase) * 1.2 * ud.ySpeed;
      fish.rotation.x = -dy * 0.15;
      if (ud.tail) ud.tail.rotation.z = Math.sin(t * 7 + ud.wobble) * 0.4;
    }
  }
  for (const flora of allFlora) {
    const type = flora.userData.type;
    const phase = flora.userData.phase;
    const swaySpeed = flora.userData.swaySpeed || 0.7;
    if (type === 'seagrass' || type === 'kelp' || type === 'clump') {
      flora.userData.segs.forEach((seg, i) => { seg.rotation.z = Math.sin(t * swaySpeed + phase + i * 0.5) * (0.08 + i * 0.03); });
    } else if (type === 'shortgrass') {
      flora.userData.segs.forEach((seg, i) => { seg.rotation.z = Math.sin(t * swaySpeed + phase + i * 0.3) * 0.15; });
    } else if (type === 'caulerpa') { flora.rotation.z = Math.sin(t * swaySpeed + phase) * 0.05; }
    else if (type === 'redalgae') { flora.rotation.z = Math.sin(t * swaySpeed + phase) * 0.06; }
    else if (type === 'sponge') { const pulse = 1 + Math.sin(t * 0.8 + phase) * 0.03; flora.scale.set(pulse, 1 + Math.sin(t * 0.8 + phase) * 0.02, pulse); }
    else if (type === 'urchin') { flora.rotation.y = Math.sin(t * 0.3 + phase) * 0.05; }
  }
  for (const b of bubbles) {
    b.position.y += b.userData.speed;
    b.position.x += Math.sin(t * 2 + b.userData.wobblePhase) * b.userData.wobbleAmp * dt * 20;
    if (b.position.y > 9) { b.position.y = 0.2; b.position.x = (Math.random() - 0.5) * 18; b.position.z = (Math.random() - 0.5) * 18; }
  }
  for (const p of plankton) {
    p.position.y += Math.sin(t * p.userData.speed + p.userData.phase) * dt * 0.1;
    p.position.x += p.userData.drift * dt * 10 + Math.cos(t * p.userData.speed * 0.5 + p.userData.phase) * dt * 0.05;
    if (p.position.y > 8.5) p.position.y = 0.5;
    if (p.position.y < 0.3) p.position.y = 7.5;
    if (p.position.x > 9) p.position.x = -9;
    if (p.position.x < -9) p.position.x = 9;
  }
  for (const ray of godRays) {
    ray.material.opacity = ray.userData.baseOpacity * (0.6 + Math.sin(t * ray.userData.speed + ray.userData.phase) * 0.4);
    ray.rotation.z = ray.userData.baseRotZ + Math.sin(t * ray.userData.swaySpeed) * 0.15;
  }
  causticTex.offset.x = t * 0.02; causticTex.offset.y = t * 0.015;
  causticTex2.offset.x = -t * 0.03; causticTex2.offset.y = t * 0.025;
  causticMat.opacity = 0.25 + state.sunlight * 0.25;
  causticMat2.opacity = 0.15 + state.sunlight * 0.15;
  const cleanColor = new THREE.Color(0x2a8fc4);
  const pollColor = new THREE.Color(0x5a7a5a);
  scene.fog.color = cleanColor.clone().lerp(pollColor, state.pollution * 0.5);
  sunLight.intensity = 1.0 + state.sunlight * 1.4;
  const bleach = Math.max(0, (state.env.temp - 29) / 7) + state.pollution * 0.25;
  coralObjects.forEach(c => {
    c.traverse(ch => {
      if (ch.material && ch.material.color) {
        if (!ch.userData.origColor) ch.userData.origColor = ch.material.color.clone();
        ch.material.color.copy(ch.userData.origColor);
        ch.material.color.lerp(new THREE.Color(0xffffff), Math.min(1, bleach));
      }
    });
  });
  const camAngle = t * 0.06;
  camera.position.x = Math.sin(camAngle) * 14;
  camera.position.z = Math.cos(camAngle) * 14;
  camera.position.y = 4.5 + Math.sin(t * 0.25) * 0.8;
  camera.lookAt(0, 2, 0);
  renderer.render(scene, camera);
}
animate();

function loginAs(name) {
  AudioEngine.init(); AudioEngine.resume();
  registerUser(name);
  const saved = loadUserState(name);
  if (saved) {
    Object.assign(state, saved);
    state.playerName = name;
    if (!state.history) state.history = [];
    if (!state.quizStats) state.quizStats = { total: 0, correct: 0, wrong: 0 };
    if (!state.categoryStats) state.categoryStats = {};
    if (!state.extra) state.extra = { quizStreak: 0, perfectThisSession: false, quizSessionsToday: 0 };
    if (state.quizPool === undefined) state.quizPool = [];
    if (state.priceInflation === undefined) state.priceInflation = 1.0;
    if (state.totalSpent === undefined) state.totalSpent = 0;
    if (state.totalEarned === undefined) state.totalEarned = 0;
    document.getElementById('loginScreen').style.display = 'none';
    syncFishMeshes(); updateUI(); updateMission();
    if (!state.currentEvent) pickDailyEvent(); else updateEventPanel();
    logBox.innerHTML = '';
    showModal('🌊 Selamat Datang Kembali!', `<p class="center">Halo <b>${name}</b>!</p><p class="center" style="font-size:10.5px;">Hari ke-${state.day} • Skor: <b>${state.score}</b><br>Saldo: <b>${formatRupiah(state.coins)}</b> • Kuis: <b>${state.quizStats.correct}/${state.quizStats.total}</b></p>`, 'LANJUT MENYELAM');
    setTimeout(() => AudioEngine.startMusic(), 500);
  } else {
    resetGame();
    state.playerName = name;
    updateUI();
    document.getElementById('loginScreen').style.display = 'none';
    addLog(`Selamat datang, ${name}!`, 'good');
    showModal('🌊 Selamat Datang!', `<p class="center">Halo <b>${name}</b>!</p><p style="font-size:10.5px;text-align:left;">🎯 <b>Misi:</b> Pulihkan ekosistem laut<br>📝 <b>Kuis:</b> 6 kategori, 65 soal<br>🎪 <b>Event harian</b> dengan hadiah<br>🎖️ <b>10 Achievement</b> untuk dikoleksi<br>💰 <b>Reward:</b> Rp per jawaban benar<br>🔊 <b>Audio aktif</b> — klik tombol di kanan atas untuk toggle<br>⚠️ Harga biota naik 15%/hari</p>`, 'MULAI MENYELAM');
    setTimeout(() => AudioEngine.startMusic(), 500);
  }
  saveUserState();
}
